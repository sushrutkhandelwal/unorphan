[project]
name = "unorphan"
version = "0.2.0"
description = "Sort loose files in your Downloads folder into project folders, using Jev to classify them."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["typesafe-sdk>=0.7.5,<0.8", "pillow>=10"]

[project.scripts]
unorphan = "unorphan.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["unorphan"]
